<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - لوحة التحكم</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; display: flex; align-items: center; justify-content: center; height: 100vh; padding: 1rem; }
        .login-card { background: #1e293b; padding: 2rem; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); width: 100%; max-width: 360px; border: 1px solid #334155; }
        .login-card h2 { margin-bottom: 1.5rem; text-align: center; color: #38bdf8; font-size: 1.5rem; }
        .form-group { margin-bottom: 1.2rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; font-size: 0.9rem; color: #94a3b8; }
        .form-group input { width: 100%; padding: 0.75rem; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #fff; outline: none; font-size: 1rem; }
        .form-group input:focus { border-color: #38bdf8; }
        button { width: 100%; padding: 0.75rem; border: none; border-radius: 6px; background: #0284c7; color: white; font-weight: bold; font-size: 1rem; cursor: pointer; transition: 0.2s; }
        button:hover { background: #0369a1; }
        .error { color: #ef4444; font-size: 0.85rem; margin-top: 1rem; text-align: center; display: none; }
    </style>
</head>
<body>

<div class="login-card">
    <h2>تسجيل الدخول</h2>
    <form id="loginForm">
        <div class="form-group">
            <label>اسم المستخدم</label>
            <input type="text" id="username" required autocomplete="off">
        </div>
        <div class="form-group">
            <label>كلمة السر</label>
            <input type="password" id="password" required>
        </div>
        <button type="submit">دخول</button>
        <div id="errorMsg" class="error">اسم المستخدم أو كلمة السر غير صحيحة</div>
    </form>
</div>

<script>
    document.getElementById('loginForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        const errorMsg = document.getElementById('errorMsg');

        // بيانات الدخول (اسم المستخدم: admin | كلمة السر: 123456)
        if (username === "admin" && password === "123456") {
            localStorage.setItem('adminLoggedIn', 'true');
            window.location.href = 'dashboard.html';
        } else {
            errorMsg.style.display = 'block';
        }
    });
</script>

</body>
</html>
